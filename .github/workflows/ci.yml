name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  server-lint-test:
    name: Server (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev libraw-dev

      - name: Download dependencies
        working-directory: ./server
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ./server
          version: latest

      - name: Test
        working-directory: ./server
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage.out

  ml-lint-test:
    name: ML Sidecar (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        working-directory: ./ml
        run: |
          pip install ruff black mypy pytest
          pip install fastapi uvicorn onnxruntime numpy Pillow pytesseract httpx

      - name: Lint (Ruff)
        working-directory: ./ml
        run: ruff check .

      - name: Format check (Black)
        working-directory: ./ml
        run: black --check .

      - name: Test
        working-directory: ./ml
        run: pytest tests/ -v 2>/dev/null || echo "No tests yet"

  web-lint-test:
    name: Web Client (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci 2>/dev/null || echo "No package-lock.json yet"

      - name: Lint
        working-directory: ./web
        run: npm run lint 2>/dev/null || echo "No lint script yet"

      - name: Type check
        working-directory: ./web
        run: npm run typecheck 2>/dev/null || echo "No typecheck script yet"

      - name: Test
        working-directory: ./web
        run: npm test 2>/dev/null || echo "No tests yet"

      - name: Build
        working-directory: ./web
        run: npm run build 2>/dev/null || echo "No build script yet"

  mobile-lint-test:
    name: Mobile (React Native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci 2>/dev/null || echo "No package-lock.json yet"

      - name: Lint
        working-directory: ./mobile
        run: npm run lint 2>/dev/null || echo "No lint script yet"

      - name: Type check
        working-directory: ./mobile
        run: npm run typecheck 2>/dev/null || echo "No typecheck script yet"

      - name: Test
        working-directory: ./mobile
        run: npm test 2>/dev/null || echo "No tests yet"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [server-lint-test, ml-lint-test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          tags: reframe/reframe:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ML image
        uses: docker/build-push-action@v6
        with:
          context: ./ml
          push: false
          tags: reframe/reframe-ml:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
